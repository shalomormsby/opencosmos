    text: "I share the belief of many of my contemporaries that the spiritual crisis pervading all spheres of Western industrial society can be remedied only by a change in our world view. We shall have to shift from the materialistic, dualistic belief that people and their environment are separate, toward a new consciousness of an all-encompassing reality, which embraces the experiencing ego, a reality in which people feel their oneness with animate nature and all of creation."
