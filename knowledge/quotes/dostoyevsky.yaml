  - id: q_0539
    slug: null
    text: "For the secret of a man’s being is not only to live but to have something to live for. Without a stable conception of the object of life, man would not consent to go on living, and would rather destroy himself than remain on earth, though he had bread in abundance."
    category: insight
    keywords: [purpose, life, death, destroy, food, bread, abundance]
    context: "Author, Russian"
    favorite: false
    source_work: null
    source_section: null
    provenance:
      status: verified
      confidence: 0.95
      wikiquote_url: "https://en.wikiquote.org/wiki/Fyodor_Dostoyevsky"
      earliest_print_source: "The Brothers Karamazov (1880), Book V, ch. 5 'The Grand Inquisitor'; Constance Garnett translation"
      notes: "The Grand Inquisitor speaks these lines to the silent Christ. The English is Garnett's. Note for the record that this is a character's argument, and a deliberately corrosive one — the Inquisitor is making the case that people will trade freedom for bread and certainty — not Dostoevsky in his own voice. Attribution to the novel is certain."
      reviewed_by_human: false
  - id: q_0540
    slug: null
    text: "They suffer, of course... But then they live, they live a real life, not a fantastic one, for suffering is life. Without suffering what would be the pleasure of life? Life would be transformed into an endless church service; it would be holy, but tedious."
    category: insight
    keywords: [suffering, life, pleasure, church, holy, transformation]
    context: "Author, Russian"
    favorite: false
    source_work: null
    source_section: null
    provenance:
      status: verified
      confidence: 0.9
      wikiquote_url: "https://en.wikiquote.org/wiki/Fyodor_Dostoyevsky"
      earliest_print_source: "The Brothers Karamazov (1880), Book XI, ch. 9 'The Devil. Ivan Fyodorovich's Nightmare'; Constance Garnett translation"
      notes: "Spoken by the devil in Ivan's hallucination, defending suffering as what keeps existence from becoming 'an endless church service... holy, but tedious.' I am confident of the novel and the chapter; wording varies slightly across translations ('what would be the pleasure of it'). Important context: the speaker is the devil, so quoting it as Dostoevsky's sincere view misreads the scene."
