      earliest_print_source: "The World According to Mister Rogers: Important Things to Remember, Fred Rogers, 2003"
      notes: "Genuine Fred Rogers. The 'active noun like struggle' formulation is distinctive and is consistently attributed to him; it appears in the authorized posthumous collection The World According to Mister Rogers (2003). Rogers used the line earlier in his own writings and talks, so 2003 is where it appears in print rather than necessarily its first utterance. Common variant ends 'right here and now' rather than 'here and now'."
