      earliest_print_source: "Either/Or, Part I, \"Diapsalmata\", Søren Kierkegaard, 1843"
      notes: "Genuine Kierkegaard, from the 'Diapsalmata' aphorisms opening Either/Or Part I (1843), written in the voice of the aesthete 'A'. Familiar in both the Swenson and Hong translations. The original aphorism continues '...For pleasure disappoints, possibility never' — the corpus text truncates before that clause, which is a legitimate excerpt rather than a distortion. Note for the record that the speaker is a pseudonymous persona, as with most of Kierkegaard's aesthetic writing."
