    slug: null
    text: "Life has no other discipline to impose, if we would but realize it, than to accept life unquestioningly. Everything we shut our eyes to, everything we run away from, everything we deny, denigrate or despise, serves to defeat us in the end. What seems nasty, painful, evil, can become a source of beauty, joy and strength, if faced with an open mind. Every moment is a golden one for him who has the vision to recognize as such."
