  - id: q_0702
    slug: null
    text: Security is mostly a superstition. It does not exist in nature... life is either a daring adventure or it is nothing at all.
    category: insight
    keywords: [security, superstition, nature, adventure, nothing, life]
    context: null
    favorite: false
    source_work: null
    source_section: null
    provenance:
      status: attributed
      confidence: 0.85
      wikiquote_url: "https://en.wikiquote.org/wiki/Helen_Keller"
      earliest_print_source: "The Open Door, Helen Keller, 1957"
      notes: "Genuinely Keller. The full passage runs 'Security is mostly a superstition. It does not exist in nature, nor do the children of men as a whole experience it. Avoiding danger is no safer in the long run than outright exposure. Life is either a daring adventure or nothing.' Standard citation is The Open Door (1957); some sources instead point to Let Us Have Faith (1940). Author attribution is solid; I am less certain which of the two volumes is the first printing, so I am holding below verified."
