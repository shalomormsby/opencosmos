      notes: "Condensed from the closing line of Voltaire's poem Le Mondain (1736): 'Le paradis terrestre est où je suis' — the earthly paradise is where I am. The attribution is solid; note that the corpus text drops 'earthly', which slightly shifts the poem's worldly, anti-ascetic joke toward a spiritual reading."
