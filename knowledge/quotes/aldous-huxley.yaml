      wikiquote_url: "https://en.wikiquote.org/wiki/Aldous_Huxley"
      earliest_print_source: "Texts and Pretexts: An Anthology with Commentaries, Aldous Huxley, 1932"
      notes: "Genuine Huxley, from the opening pages of Texts and Pretexts. Original wording: 'Experience is not what happens to a man; it is what a man does with what happens to him.' The corpus version is a modernized second-person rendering of the same sentence. Frequently misattributed elsewhere to Carl Jung and to Anthony Robbins-style paraphrasers, but Huxley is the source."
