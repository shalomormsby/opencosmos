      notes: "From the imprisoned magician Tzinacan's meditation in 'The Writing of the God', collected in El Aleph (1949). The tiger-implies-the-universe passage is one of the story's best-known moments and the English wording here matches the standard translation closely. Note it is spoken by a character within the fiction, which is worth keeping in mind for how it is framed."
