quotes:
  - id: q_0962
    slug: null
    text: "Our deepest fear is not that we are inadequate, our deepest fear is that we are powerful beyond measure. It is our light, not our darkness that most frightens us. We ask ourselves, “Who am I to be brilliant, gorgeous, talented and fabulous?” Actually, who are you not to be? We were born to manifest the glory that is within us. As we let our light shine, we unconsciously give other people permission to do the same. As we are liberated from our own fear, our presence automatically liberates others."
