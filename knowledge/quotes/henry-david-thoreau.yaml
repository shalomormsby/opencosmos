      wikiquote_url: "https://en.wikiquote.org/wiki/Henry_David_Thoreau"
      earliest_print_source: "Walden; or, Life in the Woods, Henry David Thoreau, 1854 (chapter 1, 'Economy')"
      notes: "Authentic Thoreau, from the 'Economy' chapter of Walden. The canonical wording is 'In the long run men hit only what they aim at. Therefore, though they should fail immediately, they had better aim at something high.' The corpus text has been silently modernized to 'we only hit what we aim at' — it preserves the meaning but is not what Thoreau wrote, and the second sentence, which carries the point, has been dropped. Recommend restoring the original wording before publication; the verdict is high-confidence on the source, with the caveat that the quoted text is a paraphrase of it."
