  - id: q_0710
    slug: null
    text: "If you advance confidently in the direction of your dreams, and endeavor to live the life you have imagined, you will meet with a success unexpected in common hours. You will pass an invisible boundary: new, universal and more liberal laws will begin to establish themselves around and within you and you will live with a higher order of beings. If you have built castles in the air, your work need not be lost; that is where they should be. Now put the foundation under them."
    category: creativity
    keywords: [direction, dreams, live, life, common, success, invisible, boundary, universal, laws within, self, higher, being, castles, air, work, lost, foundation, artist]
    context: null
    favorite: true
    source_work: null
    source_section: null
    provenance:
      status: verified
      confidence: 0.9
      wikiquote_url: "https://en.wikiquote.org/wiki/Henry_David_Thoreau"
      earliest_print_source: "Walden, Henry David Thoreau, 1854 (chapter 'Conclusion')"
      notes: "Both halves are genuine Walden, from 'Conclusion,' but the corpus text is the popular second-person paraphrase. Thoreau wrote in the third person: 'I learned this, at least, by my experiment: that if one advances confidently in the direction of his dreams, and endeavors to live the life which he has imagined, he will meet with a success unexpected in common hours.' The passage also compresses the original ('he will put some things behind, will pass an invisible boundary'; 'he will live with the license of a higher order of beings') and the castles line ends 'Now put the foundations under them,' plural. Source certain; wording modernized."
      reviewed_by_human: false
