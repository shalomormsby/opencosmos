      earliest_print_source: "The Picture of Dorian Gray, Oscar Wilde, 1890/1891"
      notes: "Genuine Wilde, spoken by Lord Henry Wotton in Chapter 2. The canonical wording runs '...nothing can cure the soul but the senses, just as nothing can cure the senses but the soul.' The record here reverses the clauses and substitutes 'there is nothing that will cure' — same sentence, loosely requoted. Recommend restoring Wilde's wording."
