      earliest_print_source: "The Picture of Dorian Gray, Oscar Wilde, 1890/1891; Lady Windermere's Fan, Oscar Wilde, 1892"
      notes: "Both halves are authentically Wilde but they are two separate quotations welded together. 'The only way to get rid of a temptation is to yield to it' is Lord Henry in Dorian Gray ch. 2; 'I can resist everything except temptation' is Lord Darlington in Lady Windermere's Fan, Act I. The record also corrupts the second line to 'buy temptation'. Recommend splitting into two records and fixing the typo."
