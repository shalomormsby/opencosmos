      earliest_print_source: "The Hero with a Thousand Faces, Joseph Campbell, 1949 (Prologue, \"Myth and Dream\")"
      notes: "A genuine and famous passage from The Hero with a Thousand Faces, closing the 'Myth and Dream' discussion in the Prologue. The wording — thread of the hero-path, abomination/God, slay ourselves, come to the center of our own existence, be with all the world — matches the text as I know it. High confidence on book and year; the section attribution is from memory and should be spot-checked against a copy before it is treated as a page-level citation."
