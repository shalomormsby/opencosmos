    text: Talent hits a target no one else can hit. Genius hits a target no one else can see.
    category: insight
    keywords: [skill]
    context: "Philosophy, German"
    favorite: false
    source_work: null
    source_section: null
    provenance:
      status: verified
      confidence: 0.9
      wikiquote_url: "https://en.wikiquote.org/wiki/Arthur_Schopenhauer"
      earliest_print_source: "The World as Will and Representation, Vol. II, Ch. 31 ('On Genius'), Arthur Schopenhauer, 1844"
      notes: "Genuine Schopenhauer. The German original runs roughly 'Das Talent gleicht dem Schuetzen, der ein Ziel trifft, welches die Uebrigen nicht erreichen koennen; das Genie dem, der eines trifft, bis zu welchem sie nicht einmal zu sehen vermoegen' — from the supplementary volume of Die Welt als Wille und Vorstellung (1844), chapter on genius. The English wording here is the standard condensed rendering rather than a literal translation of Payne or Haldane/Kemp, so the sense is Schopenhauer's but the phrasing is a popular paraphrase. Attribution itself is not in doubt."
      reviewed_by_human: false
