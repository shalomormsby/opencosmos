  - id: q_0087
    slug: null
    text: "Of all people only those are at leisure who make time for philosophy, only those are really alive. For they not only keep a good watch over their own lifetimes, but they annex every age to theirs. All the years that have passed before them are added to their own. Unless we are very ungrateful, all those distinguished founders of holy creeds were born for us and prepared for us a way of life. By the toil of others we are led into the presence of things which have been brought from darkness into light. We are excluded from no age, but we have access to them all; and if we are prepared in loftiness of mind to pass beyond the narrow confines of human weakness, there is a long period of time through which we can roam."
    category: insight
    keywords: [perspective, learning, life, lifelong learner]
    context: "Philosophy, Stoic, Ancient Greek, Wisdom"
    favorite: false
    source_work: null
    source_section: null
    provenance:
      status: verified
      confidence: 0.9
      wikiquote_url: "https://en.wikiquote.org/wiki/Seneca_the_Younger"
      earliest_print_source: "De Brevitate Vitae (On the Shortness of Life), Seneca, c. 49 CE, ch. 14; this English wording from C. D. N. Costa's translation (Penguin, 1997)"
      notes: "Genuine and correctly transcribed. This is the opening of De Brevitate Vitae 14, Seneca's argument that the philosopher annexes all past ages to his own lifetime. The English is C. D. N. Costa's Penguin translation, whose distinctive phrasing ('they annex every age to theirs', 'in loftiness of mind to pass beyond the narrow confines of human weakness') matches this text closely. Note the corpus context field says 'Ancient Greek' — Seneca was Roman and wrote in Latin."
      reviewed_by_human: false
