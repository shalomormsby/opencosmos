      wikiquote_url: "https://en.wikiquote.org/wiki/Max_Planck"
      earliest_print_source: "\"Das Wesen der Materie\" (The Nature of Matter), lecture in Florence, Max Planck, 1944"
      notes: "Genuine Planck, from his 1944 Florence lecture 'Das Wesen der Materie'; the German original runs 'Es gibt keine Materie an sich... Wir müssen hinter dieser Kraft die Existenz eines bewußten intelligenten Geistes annehmen. Dieser Geist ist der Urgrund aller Materie,' preserved in the Archiv zur Geschichte der Max-Planck-Gesellschaft. Caveat worth carrying: this is one of the most heavily context-stripped quotations in physics. It is routinely deployed as evidence that Planck endorsed a personal God or a consciousness-creates-reality metaphysics; his own religious views were considerably more reserved, and 'Geist' here does not map cleanly onto the popular English reading of 'Mind.' Attribution verified, interpretation frequently abused."
