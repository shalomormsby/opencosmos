    context: null
    favorite: false
    source_work: null
    source_section: null
    provenance:
      status: verified
      confidence: 0.8
      wikiquote_url: "https://en.wikiquote.org/wiki/Marcus_Aurelius"
      earliest_print_source: "Meditations, Marcus Aurelius, Book 11.18 (c. 170–180 CE)"
      notes: "Genuine, from the long passage in Meditations 11.18 on how to respond to people who wrong you, which closes on the claim that gentleness or kindness cannot be defeated when it is sincere — Hays renders it 'Kindness is invincible, provided it's sincere'. Translations split between 'gentleness' and 'kindness', so the three-word form here is a compression of a conditional sentence: Marcus qualifies it with 'if it be genuine'. Attribution is sound; the aphoristic trimming drops that qualifier."
      reviewed_by_human: false
