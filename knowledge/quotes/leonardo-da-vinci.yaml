      earliest_print_source: "The Notebooks of Leonardo da Vinci / Trattato della Pittura; English ed. Jean Paul Richter, 1883"
      notes: "This is genuine Leonardo, from the painting precepts collected in the Trattato della Pittura and reproduced in the standard notebook editions (Richter 1883; MacCurdy 1938). It appears among his instructions to painters on stepping back from work to judge it — the passage advising the painter to withdraw, since distance shrinks the work and makes disharmony of proportion visible at a glance. Translations vary in wording, and 'a lack of harmony or portion' in the corpus text looks like a corruption of 'proportion'. I am confident in the attribution but not in the precise translation lineage of this rendering, so I am holding just at the promotion bar rather than claiming primary verification."
