    text: "Every now and then go away, have a little relaxation, for when you come back to your work your judgment will be surer since to remain constantly at work will cause you to lose power of judgment. Go some distance away because then the work appears smaller, and more of it can be taken in at a glance, and a lack of harmony or portion is more readily seen."
