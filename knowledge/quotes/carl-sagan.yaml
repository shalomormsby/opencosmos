  - id: q_0424
    slug: null
    text: "The earth is a very small stage in a vast cosmic arena. Think of the rivers of blood spilled by all those generals and emperors so that in glory and in triumph they could become the momentary masters of a fraction of a dot. Think of the endless cruelties visited by the inhabitants of one corner of the dot on scarcely distinguishable inhabitants of some other corner of the dot. How frequent their misunderstandings, how eager they are to kill one another, how fervent their hatreds. Our posturings, our imagined self-importance, the delusion that we have some privileged position in the universe, are challenged by this point of pale light. Our planet is a lonely speck in the great enveloping cosmic dark. In our obscurity -- in all this vastness -- there is no hint that help will come from elsewhere to save us from ourselves. It is up to us. It's been said that astronomy is a humbling, and I might add, a character-building experience. To my mind, there is perhaps no better demonstration of the folly of human conceits than this distant image of our tiny world. To me, it underscores our responsibility to deal more kindly and compassionately with one another and to preserve and cherish that pale blue dot, the only home we've ever known."
    category: insight
    keywords: [astronomy, science, humanity, war, violence, cosmic, blood, misunderstanding, kill, death, hatred, universe, darkness, conceit, human, world, small, responsibility, kindness, compassion, relationship, home]
    context: Scientist
    favorite: false
    source_work: null
    source_section: null
    provenance:
      status: verified
      confidence: 0.95
      wikiquote_url: "https://en.wikiquote.org/wiki/Carl_Sagan"
      earliest_print_source: "Pale Blue Dot: A Vision of the Human Future in Space, Carl Sagan, Random House, 1994, chapter 1"
      notes: "Genuine — the central portion of the 'Pale Blue Dot' reflection on the 1990 Voyager 1 photograph, from the opening chapter of the 1994 book, and later widely circulated as a recorded reading. This excerpt begins mid-passage; the full text opens 'Look again at that dot. That's here. That's home. That's us.' Two mechanical notes for the corpus: the double hyphens should be em dashes, and given the length this is arguably a passage rather than a quote — consider whether it wants an excerpt marker."
      reviewed_by_human: false
