  - id: q_0448
    slug: null
    text: "Present global culture is a kind of arrogant newcomer. It arrives on the planetary stage following four and a half billion years of other acts, and after looking about for a few thousand years declares itself in possession of eternal truths. But in a world that is changing as fast as ours, this is a prescription for disaster. No nation, no religion, no economic system, no body of knowledge, is likely to have all the answers for our survival. There must be many social systems that would work far better than any now in existence. In the scientific tradition, our task is to find them."
    category: insight
    keywords: [culture, society, history, time, truth, world, change, nation, religion, knowledge, answers, survival, science, discover, work]
    context: Scientist
    favorite: false
