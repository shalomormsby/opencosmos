      earliest_print_source: "The Demon-Haunted World: Science as a Candle in the Dark, Carl Sagan, 1995, ch. 2 ('Science and Hope')"
      notes: "A well-documented passage from The Demon-Haunted World. The full paragraph — including the Gandhi and King examples and the closing 'does a disservice to both' — matches the book text as I know it. This is one of the most reliably sourced Sagan quotations on science and spirituality."
      reviewed_by_human: false
  - id: q_0429
    slug: null
    text: "A book is made from a tree. It is an assemblage of flat, flexible parts (still called \"leaves\") imprinted with dark pigmented squiggles. One glance at it and you hear the voice of another person, perhaps someone dead for thousands of years. Across the millennia, the author is speaking, clearly and silently, inside your head, directly to you. Writing is perhaps the greatest of human inventions, binding together people, citizens of distant epochs, who never knew one another. Books break the shackles of time, proof that humans can work magic.\""
    category: insight
    keywords: [books, reading, tree, leaves, voice, time, person, dead, author, head, human, invention, people, magic]
    context: Scientist
