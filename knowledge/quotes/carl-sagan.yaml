  - id: q_0436
    slug: null
    text: "One of the reasons for its success is that science has a built-in, error-correcting machinery at its very heart. Some may consider this an overbroad characterization, but to me every time we exercise self-criticism, every time we test our ideas against the outside world, we are doing science. When we are self-indulgent and uncritical, when we confuse hopes and facts, we slide into pseudoscience and superstition."
    category: insight
    keywords: [science, error, correction, machinery, criticism, test, world, facts, superstition]
    context: Scientist
    favorite: false
