quotes:
  - id: q_0530
    slug: null
    text: "To study the Buddha Way is to study the self. / To study the self is to forget the self. / To forget the self is to be actualized by the myriad things. / When actualized by the myriad things, your body and mind / as well as the bodies and minds of others drop away. / No trace of realization remains and this no trace continues endlessly."
