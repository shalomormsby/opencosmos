      notes: "Genuine Chesterfield, from the celebrated letter to his son on the use of time, dated 26 December 1749 Old Style and published in the 1774 collection 'Letters to His Son'. The original opens 'Know the true value of time' — the corpus text has dropped 'true'. Original punctuation is 'no procrastination: never put off till to-morrow what you can do to-day.' The 'never put off till tomorrow' proverb long predates Chesterfield and is not his coinage; he is quoting a commonplace inside a sentence that is his own."
