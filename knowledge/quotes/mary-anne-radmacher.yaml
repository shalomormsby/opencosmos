      notes: "Genuinely Mary Anne Radmacher's. She is a living writer and artist who has publicly claimed and defended this line, which she composed well before the 2009 Conari Press book that takes its title from it (the phrase circulated on her prints and cards from the late 1980s onward). It is frequently misattributed on the internet to Mary Anne Radmacher-Hershey, to 'anonymous', and occasionally to Maya Angelou — all of which resolve back to Radmacher. The book above is the clearest print anchor I can cite, though it postdates the line's origin."
