    text: "Conscious change is brought about by the two qualities inherent in consciousness: attention and intention. Attention energizes, and intention transforms. Whatever you put your attention on will grow stronger in your life. Whatever you take your attention away from will wither, disintegrate, and disappear. Intention, on the other hand, triggers transformation of energy and information. Intention organizes its own fulfillment."
