  - id: q_0315
    slug: null
    text: "Look for your own. Do not do what someone else could do as well as you. Do not say, do not write what someone else could say, could write as well as you. Care for nothing in yourself but what you feel exists nowhere else, and out of your self create, impatiently or patiently... the most irreplaceable of things."
    category: creativity
    keywords: [individuality, unique, action, writing, self, nothing, creation]
    context: "Author, French"
    favorite: false
    source_work: null
    source_section: null
    provenance:
      status: verified
      confidence: 0.85
      wikiquote_url: "https://en.wikiquote.org/wiki/Andr%C3%A9_Gide"
      earliest_print_source: "Les Nourritures terrestres (The Fruits of the Earth), André Gide, 1897"
      notes: "From the closing envoi of The Fruits of the Earth, addressed to Nathanaël. Standard translations end 'the most irreplaceable of beings' rather than 'of things', and the passage as given has been trimmed of its direct address to Nathanaël — worth normalizing against a published translation. The attribution itself is secure."
