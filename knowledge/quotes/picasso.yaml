      notes: "Genuine Picasso, from his 1923 statement published as 'Picasso Speaks' in The Arts, given to Marius de Zayas. The original runs: 'We all know that Art is not truth. Art is a lie that makes us realize truth, at least the truth that is given us to understand.' The version here is the standard compressed paraphrase ('makes us realize the truth'), so the attribution is verified even though the wording is abridged. Author field should read 'Pablo Picasso' rather than the bare surname."
