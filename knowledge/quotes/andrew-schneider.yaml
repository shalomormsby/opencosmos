    text: "We live in a world that needs more soul, more meaning. We, as conscious beings, have, as our primary responsibility, at this time in human history, the task of bringing soul into the world, or releasing soul into the world. We do this, first of all, in ourselves and in our own personal world; then we do it in our groups – including family; then we do it in our society through our work, relationships and presence there."
