      earliest_print_source: "Operating Manual for Spaceship Earth, R. Buckminster Fuller, 1969"
      notes: "Core Fuller, and the 'Spaceship Earth' framing plus the closing 'It has to be everybody or nobody' are both signature formulations of his from this period. I place the passage in 'Operating Manual for Spaceship Earth' (1969); Fuller also repeated the 'everybody or nobody' line in later lectures and in 'Critical Path' (1981), so the exact wording here may reflect one of those restatements rather than the 1969 text verbatim."
