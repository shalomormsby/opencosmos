      wikiquote_url: "https://en.wikiquote.org/wiki/Martin_Luther_King_Jr."
      earliest_print_source: "\"The Drum Major Instinct,\" sermon at Ebenezer Baptist Church, Martin Luther King Jr., 4 February 1968"
      notes: "From the closing movement of King's 'Drum Major Instinct' sermon, delivered at Ebenezer Baptist Church in Atlanta on 4 February 1968, two months before his assassination. The passage — 'Everybody can be great, because everybody can serve... You only need a heart full of grace, a soul generated by love' — is well documented in the King Papers and in recordings of the sermon. The corpus rendering ('anybody can serve') is a common variant of the delivered line; the substance and sourcing are solid."
