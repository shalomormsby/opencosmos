      earliest_print_source: "\"Suffering and Faith,\" Martin Luther King Jr., The Christian Century, 27 April 1960"
      notes: "This is from King's short essay 'Suffering and Faith,' published in The Christian Century on 27 April 1960 (vol. 77, p. 510), written after the Montgomery years. The wording here matches the published text closely; the original reads 'two ways that I could respond to my situation' and uses a colon rather than a dash, so the corpus text is a very light punctuation/wording variant of a genuine passage."
