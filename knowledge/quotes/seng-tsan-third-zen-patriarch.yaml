    text: "When the mind exists undisturbed in the Way, nothing in the world can offend, and when a thing can no longer offend, it ceases to exist in the old way... If you wish to move in the One Way do not dislike even the world of senses and ideas. Indeed, to accept them fully is identical with true Enlightenment."
