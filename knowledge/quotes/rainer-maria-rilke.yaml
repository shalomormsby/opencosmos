  - id: q_1161
    slug: null
    text: "I beg you... to have patience with every thing unresolved in your heart and try to love the questions themselves as if they were locked rooms or books written in a very foreign language. Don't search for the answers, which could not be given to you now, because you would not be able to live them. And the point is, to live everything. Live the questions now. Perhaps then, someday far in the future, you will gradually, without ever noticing it, live your way into the answer..."
    category: insight
    keywords: [questions, answers, life, future, time]
    context: "Author, German"
    favorite: false
