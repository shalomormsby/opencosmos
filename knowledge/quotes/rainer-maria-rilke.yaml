  - id: q_1158
    slug: null
    text: I do only want to advise you to keep growing quietly and seriously throughout your whole development; you cannot disturb it more rudely than by looking outward and expecting from outside replies to questions that only your inmost feeling in your most hushed hour can perhaps answer.
