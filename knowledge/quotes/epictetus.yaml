      earliest_print_source: "Encheiridion (The Manual), Epictetus, c. 125 CE, §8"
      notes: "Genuine, from Encheiridion 8, one of the best-known lines in the handbook: do not seek to have events happen as you wish, but wish them to happen as they do, and your life will go well. The phrasing here is a variant translation rather than the standard Long or Hard wording, but it renders the same sentence and the locus is not in doubt."
