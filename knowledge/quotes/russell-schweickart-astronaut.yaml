    text: "You realize that on that small spot, that little blue and white thing, is everything that means anything to you - all of history and music and poetry and art and death and birth and love, tears, joy, games, all of it on that little spot out there... You recognize that you are a piece of this total life... And when you come back there is a difference in that world now. There is a difference in that relationship between you and that planet and you and all those other forms of life on that planet, because you've had that kind of experience."
