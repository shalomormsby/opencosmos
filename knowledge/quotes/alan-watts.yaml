      notes: "Genuine Alan Watts, and unusually well sourced for him: this passage is consistently cited to Nature, Man and Woman (1958), and I recall it appearing in the sourced (not the 'attributed') portion of his Wikiquote entry. The argument — that purposiveness makes the senses miss the world, and that purposelessness is receptive — is a central thesis of that book, and the extended paragraph form is authentic Watts prose rather than a lecture-transcript fragment. Marked attributed rather than verified only because I cannot confirm the page from memory."
