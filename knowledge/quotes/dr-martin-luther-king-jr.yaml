      wikiquote_url: "https://en.wikiquote.org/wiki/Martin_Luther_King,_Jr."
      earliest_print_source: "'I've Been to the Mountaintop', Mason Temple, Memphis, 3 April 1968"
      notes: "King said this in his final speech, 'I've Been to the Mountaintop,' the night before his assassination: 'Only when it is dark enough can you see the stars.' Worth noting for the corpus that King was invoking an older aphorism, commonly credited to the historian Charles A. Beard and sometimes loosely to Emerson; King is the popularizer rather than the originator of the thought, but the utterance attributed to him is genuine."
      reviewed_by_human: false
  - id: q_0177
    slug: null
    text: "Love is the most durable power in the world. This creative force, so beautifully exemplified in the life of our Christ, is the most potent instrument available in mankind’s quest for peace and security."
    category: insight
    keywords: [conflict resolution]
    context: Christian
    favorite: false
    source_work: null
    source_section: null
    provenance:
      status: verified
      confidence: 0.88
      wikiquote_url: "https://en.wikiquote.org/wiki/Martin_Luther_King,_Jr."
      earliest_print_source: "'The Most Durable Power,' Martin Luther King Jr., The Christian Century, 1957 (from a sermon delivered at Dexter Avenue Baptist Church, Montgomery, November 1956)"
      notes: "This is King's own language from the sermon/essay 'The Most Durable Power,' delivered at Dexter Avenue Baptist Church during the closing weeks of the Montgomery bus boycott and excerpted in The Christian Century in 1957; it is indexed in The Papers of Martin Luther King, Jr. and reprinted in A Testament of Hope. The wording here (durable power / creative force / exemplified in the life of our Christ / quest for peace and security) matches the published text. I am confident in the sermon and the Christian Century publication; I am not certain of the exact issue date, so treat the year rather than a day as the firm part of the citation."
      reviewed_by_human: false
