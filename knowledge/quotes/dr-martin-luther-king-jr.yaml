  - id: q_0155
    slug: null
    text: "Darkness cannot drive out darkness; only light can do that. Hate cannot drive out hate; only love can do that. Hate multiplies hate, violence multiplies violence, and toughness multiplies toughness in a descending spiral of destruction... The chain reaction of evil – hate begetting hate, wars producing more wars – must be broken, or we shall be plunged into the darkness of annihilation."
    category: insight
    keywords: [darkness, light, hate, love, violence, destruction, evil, war]
    context: Christian
    favorite: false
    source_work: null
    source_section: null
    provenance:
      status: verified
      confidence: 0.88
      wikiquote_url: "https://en.wikiquote.org/wiki/Martin_Luther_King,_Jr."
      earliest_print_source: "Strength to Love, Martin Luther King, Jr., 1963 (sermon 'Loving Your Enemies')"
      notes: "Authentic King, from the 'Loving Your Enemies' sermon collected in 'Strength to Love' (1963). One wording caution: King's published sentence ends 'plunged into the dark abyss of annihilation,' not 'the darkness of annihilation,' and the passage here is a condensation joining sentences separated in the original by the ellipsis. Recommend restoring the published wording. Attribution itself is beyond doubt."
      reviewed_by_human: false
