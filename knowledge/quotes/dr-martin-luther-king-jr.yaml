  - id: q_0152
    slug: null
    text: "I am cognizant of the interrelatedness of all communities and states. I cannot sit idly by in Atlanta and not be concerned about what happens in Birmingham. Injustice anywhere is a threat to justice everywhere. We are caught in an inescapable network of mutuality, tied in a single garment of destiny. Whatever affects one directly, affects all indirectly."
    category: insight
    keywords: [interconnectedness]
    context: Christian
    favorite: false
    source_work: null
    source_section: null
    provenance:
