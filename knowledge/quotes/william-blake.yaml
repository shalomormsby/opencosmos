      wikiquote_url: "https://en.wikiquote.org/wiki/William_Blake"
      earliest_print_source: "Auguries of Innocence, William Blake, written c. 1803, first published 1863 in Gilchrist's Life of William Blake"
      notes: "The opening quatrain of Auguries of Innocence, from the Pickering Manuscript. Attribution is beyond dispute. Two transcription defects in the corpus text should be fixed before publication: 'infintiy' is a typo for 'infinity', and Blake's text reads 'a Wild Flower' (two words) not 'a wildflower'. Blake's line breaks are four lines, not two; the canonical text is 'To see a World in a Grain of Sand / And a Heaven in a Wild Flower, / Hold Infinity in the palm of your hand / And Eternity in an hour.'"
