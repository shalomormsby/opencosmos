      earliest_print_source: "Letter to Theo van Gogh, Arles, September 1888 (collected in The Complete Letters of Vincent van Gogh)"
      notes: "This is a genuine line from Van Gogh's correspondence with his brother Theo, from a letter written at Arles in September 1888. Translations vary between 'nothing more truly artistic' and 'nothing more genuinely artistic than to love people', which is the usual signature of a real translated letter rather than an invented aphorism. I am confident of the letter's existence and rough date but cannot recall the catalogue letter number from memory, so I have not asserted one."
