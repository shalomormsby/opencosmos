      earliest_print_source: "Back to Methuselah, George Bernard Shaw, 1921 (Part I, Act I)"
      notes: "Genuine Shaw. Spoken by the Serpent to Eve in Part I ('In the Beginning') of 'Back to Methuselah' (1921). Widely known in Robert F. Kennedy's paraphrase — 'Some men see things as they are and say why; I dream things that never were and say why not' — which RFK used in his 1968 campaign and which is sometimes mistaken for the original; Kennedy credited Shaw. The text as recorded here matches Shaw's wording. Note the corpus text carries stray wrapping double quotes around the whole line that should probably be stripped."
