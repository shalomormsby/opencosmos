      wikiquote_url: "https://en.wikiquote.org/wiki/George_Bernard_Shaw"
      earliest_print_source: "Man and Superman, George Bernard Shaw, 1903 (Epistle Dedicatory to Arthur Bingham Walkley)"
      notes: "Genuine Shaw, from the Epistle Dedicatory prefacing 'Man and Superman' (1903). The surrounding passage runs: 'This is the true joy in life, the being used for a purpose recognized by yourself as a mighty one... I want to be thoroughly used up when I die, for the harder I work, the more I live. I rejoice in life for its own sake. Life is no brief candle to me. It is a sort of splendid torch which I have got hold of for the moment, and I want to make it burn as brightly as possible before handing it on to future generations.' Wording note for the corpus: the original reads 'which I have got hold of for the moment', not 'which I have got to hold up for the moment'. Recommend correcting the text to match the source."
