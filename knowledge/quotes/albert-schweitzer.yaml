      notes: "This is Schweitzer's core statement of Ehrfurcht vor dem Leben (reverence for life) and is a genuine passage from his ethics volume, where he defines the ethical man as one for whom all life is sacred and who helps all life in need. Schweitzer restates it in Out of My Life and Thought (1931). Confident in the author and the work; slight residual uncertainty only on chapter/page and translation wording."
