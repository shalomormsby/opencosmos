  - id: q_0260
    slug: null
    text: "A human being is a part of a whole, called by us universe, a part limited in time and space. He experiences himself, his thoughts and feelings as something separated from the rest... a kind of optical delusion of his consciousness. This delusion is a kind of prison for us, restricting us to our personal desires and to affection for a few persons nearest to us. Our task must be to free ourselves from this prison by widening our circle of compassion to embrace all living creatures and the whole of nature in its beauty."
    category: spirit
    keywords: [human, whole, universe, time, space, experience, self, thought, feeling, separate, illusion, consciousness, delusion, prison, desire, affection, people, near, task, freedom, circle, compassion, embrace, life, animals, nature, beauty, perception]
    context: "Scientist, Theoretical Physicist"
    favorite: true
    source_work: null
    source_section: null
    provenance:
      status: verified
      confidence: 0.9
      wikiquote_url: "https://en.wikiquote.org/wiki/Albert_Einstein"
      earliest_print_source: "Letter to Robert S. Marcus, 12 February 1950 (Albert Einstein Archives 60-424); widely reprinted, including in the New York Post, 28 November 1972"
      notes: "The genuine article. Einstein wrote this in a condolence letter to Robert S. Marcus, political director of the World Jewish Congress, after the death of Marcus's son. The archival letter exists, which is why this passage survives scrutiny where its New Age paraphrases do not. Two small textual notes: the original reads 'a part of the whole' rather than 'a part of a whole' and 'widening our circles of compassion'; the ellipsis in the corpus text elides 'as something separated from the rest' into the following clause. Worth normalising against the archive text."
