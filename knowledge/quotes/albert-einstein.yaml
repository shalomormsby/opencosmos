  - id: q_0272
    slug: null
    text: "The finest emotion of which we are capable is the mystic emotion. Herein lies the germ of all art and all true science. Anyone to whom this feeling is alien, who is no longer capable of wonderment and lives in a state of fear is a dead man. To know that what is impenetrable for us really exists and manifests itself as the highest wisdom and the most radiant beauty, whose gross forms alone are intelligible to our poor faculties - this knowledge, this feeling ... that is the core of the true religious sentiment. In this sense, and in this sense alone, I rank myself among profoundly religious men."
    category: spirit
    keywords: [mystic, emotion, feeling, art, science, wonder, fear, dead, manifest, wisdom, beauty, radiant, knowledge, religious]
    context: "Scientist, Theoretical Physicist"
    favorite: true
    source_work: null
    source_section: null
    provenance:
      status: verified
      confidence: 0.88
      wikiquote_url: "https://en.wikiquote.org/wiki/Albert_Einstein"
      earliest_print_source: "\"What I Believe\", Albert Einstein, Forum and Century vol. 84 (1930); reprinted in The World As I See It / Mein Weltbild (1934-35)"
      notes: "Genuine Einstein passage from his 1930 credo essay 'What I Believe'. The canonical translation reads 'The most beautiful experience we can have is the mysterious. It is the fundamental emotion which stands at the cradle of true art and true science...' The wording here ('the finest emotion of which we are capable is the mystic emotion... the germ of all art and all true science') is a different, older English rendering that circulates widely, notably via Lincoln Barnett's The Universe and Dr. Einstein (1948). Content, structure, and closing sentence ('in this sense, and in this sense alone, I rank myself among profoundly religious men') all match the authentic essay. Verified as Einstein; the exact English wording is translation-dependent."
      reviewed_by_human: false
