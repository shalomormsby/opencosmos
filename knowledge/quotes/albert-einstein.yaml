      wikiquote_url: "https://en.wikiquote.org/wiki/Albert_Einstein"
      earliest_print_source: "\"Old Man's Advice to Youth: 'Never Lose a Holy Curiosity,'\" LIFE magazine, 2 May 1955, p. 64"
      notes: "A rare case where an Einstein quotation of this kind is genuine. It comes from remarks Einstein made to William Miller, published in LIFE shortly after Einstein's death in April 1955 under the headline that itself quotes the last line. This is one of the sourced entries on Einstein's Wikiquote page rather than one of the many unsourced accretions. Wording as given matches the published version."
      reviewed_by_human: false
  - id: q_0178
    slug: null
    text: "The most beautiful thing we can experience is the mysterious. It is the source of all true art and science. He to whom the emotion is a stranger, who can no longer pause to wonder and stand wrapped in awe, is as good as dead; his eyes are closed. The insight into the mystery of life, coupled though it be with fear, has also given rise to religion. To know what is impenetrable to us really exists, manifesting itself as the highest wisdom and the most radiant beauty, which our dull faculties can comprehend only in their most primitive forms — this knowledge, this feeling is at the center of true religiousness."
    category: creativity
    keywords: [mysterious, mystery, art, science, beauty, experience, "true"]
    context: Scientist
    favorite: false
    source_work: null
    source_section: null
    provenance:
      status: verified
      confidence: 0.92
      wikiquote_url: "https://en.wikiquote.org/wiki/Albert_Einstein"
      earliest_print_source: "'What I Believe,' Albert Einstein, Forum and Century, vol. 84, 1930; collected in The World As I See It, 1931 (Mein Weltbild, 1934)"
      notes: "Genuine Einstein, and unusually well documented for him. This is the closing passage of his credo essay 'What I Believe,' published in Forum and Century in 1930 and collected in The World As I See It. The long form quoted here matches the standard English translation, including 'as good as dead; his eyes are closed' and the concluding 'this knowledge, this feeling is at the center of true religiousness.' Truncated one-line versions circulate widely, but the full passage given here is faithful."
      reviewed_by_human: false
