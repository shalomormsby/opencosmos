  - id: q_0212
    slug: null
    text: "I enjoyed my own nature to the fullest, and we all know that there lies happiness although, to sooth one another mutually, we occasionally pretend to condemn such joys as selfishness."
    category: insight
    keywords: [enjoyment, self, selfish, happiness]
    context: Philosopher
    favorite: false
    source_work: null
    source_section: null
    provenance:
      status: verified
      confidence: 0.85
      wikiquote_url: "https://en.wikiquote.org/wiki/Albert_Camus"
      earliest_print_source: "The Fall (La Chute), Albert Camus, 1956, trans. Justin O'Brien"
      notes: "From The Fall (La Chute, 1956), spoken by the narrator Jean-Baptiste Clamence in his monologue about the pleasures of his earlier life. The diction ('to sooth one another mutually', 'condemn such joys as selfishness') is the Justin O'Brien English translation. Important context for corpus use: this is a fictional character's self-justifying confession, not Camus speaking in his own voice — Clamence is an unreliable narrator and the novel is an indictment of exactly this posture. Attribution to Camus as author is sound; presenting it as Camus's personal counsel would misread it."
