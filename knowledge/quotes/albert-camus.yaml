      wikiquote_url: "https://en.wikiquote.org/wiki/Albert_Camus"
      earliest_print_source: "\"Retour à Tipasa\", in L'Été, Albert Camus, 1954 (essay first published 1952)"
      notes: "Genuine Camus, from the essay 'Retour à Tipasa' ('Return to Tipasa'), collected in L'Été (Summer, 1954). Original French: 'Au milieu de l'hiver, j'apprenais enfin qu'il y avait en moi un été invincible.' Note the English here is the loose popular rendering; a closer translation is 'In the midst of winter, I finally learned that there was in me an invincible summer.' The substitution of 'I found' for 'I learned at last' and the stray comma before 'an invincible summer' are artifacts of quote-site transmission, so the attribution is verified but the wording is a paraphrase of the standard translation."
