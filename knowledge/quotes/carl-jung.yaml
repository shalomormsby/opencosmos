    text: "Your vision will become clear only when you can look into your own heart. Who looks outside, dreams; who looks inside, awakes."
    category: insight
    keywords: [vision, look, dream, heart, sleep, awaken, outside, within, clear]
    context: Psychology
    favorite: true
    source_work: null
