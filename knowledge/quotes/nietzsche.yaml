      earliest_print_source: "Also sprach Zarathustra (Thus Spoke Zarathustra), Friedrich Nietzsche, 1883-1885 - Part IV, 'On the Higher Man', §20"
      notes: "Genuine Nietzsche. German original: 'Und verloren sei uns der Tag, wo nicht Ein Mal getanzt wurde! Und falsch heisse uns jede Wahrheit, bei der es nicht Ein Gelaechter gab!' The English here is a common paraphrastic rendering ('we should consider every day lost...') rather than a literal translation of the imperative, but the source is not in doubt."
