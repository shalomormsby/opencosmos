      earliest_print_source: "'The Guts of a New Machine', Rob Walker, The New York Times Magazine, 30 November 2003"
      notes: "Jobs said this to Rob Walker in the New York Times Magazine piece on the iPod. The fuller passage runs 'Most people make the mistake of thinking design is what it looks like... That's not what we think design is. It's not just what it looks like and feels like. Design is how it works.' The condensed form quoted here is faithful to the sense and is the version that entered general circulation."
