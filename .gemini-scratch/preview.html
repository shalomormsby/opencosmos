<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Infinity Loading — SVG Preview</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #08080f;
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', system-ui, sans-serif;
      color: rgba(200, 190, 230, 0.6);
    }
    .preview-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 40px;
    }
    .svg-frame {
      width: 500px;
      height: 500px;
      border: 1px solid rgba(130, 110, 200, 0.1);
      border-radius: 12px;
      overflow: hidden;
    }
    .svg-frame img,
    .svg-frame object {
      width: 100%;
      height: 100%;
    }
    .reference {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }
    .reference img {
      width: 500px;
      height: 500px;
      border: 1px solid rgba(130, 110, 200, 0.1);
      border-radius: 12px;
    }
    h2 {
      font-size: 14px;
      font-weight: 400;
      letter-spacing: 2px;
      text-transform: uppercase;
      opacity: 0.5;
    }
    .comparison {
      display: flex;
      gap: 40px;
      align-items: flex-start;
    }
  </style>
</head>
<body>
  <div class="preview-container">
    <div class="comparison">
      <div class="reference">
        <h2>SVG Animation</h2>
        <div class="svg-frame">
          <object type="image/svg+xml" data="infinity-loading.svg">
            Your browser does not support SVGs.
          </object>
        </div>
      </div>
      <div class="reference">
        <h2>Original GIF Reference</h2>
        <img src="/Users/shalomormsby/Desktop/Infinity-anim.gif" alt="Reference GIF" />
      </div>
    </div>
  </div>
</body>
</html>
